dataset_version: '1.0'
active_profile: P4
input_specification:
  channels: 1
  bit_depth: 8-bit or 16-bit
  format: Side-Scan Sonar Acoustic Waterfall
preprocessing_chain:
- step: '01'
  name: quality_snr_check
  threshold_min_snr: 3.0
- step: '02'
  name: percentile_normalization
  p_low: 1.0
  p_high: 99.0
- step: '03'
  name: lee_speckle_filter
  window_size: 5
  noise_variance: 0.04
- step: '04'
  name: clahe_equalization
  clip_limit: 2.0
  tile_grid_size:
  - 8
  - 8
- step: '05'
  name: deterministic_tiling
  tile_size: 640
  stride: 512
  overlap: 0.2
training_resolution:
- 640
- 640
- 3
inference_consistency_enforced: true
