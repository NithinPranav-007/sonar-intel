services:
  - type: web
    name: sonar-intel-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_MODEL_ID
        value: Samyukta31/sonar_yolo
      - key: HF_MODEL_FILE
        value: best_distilled_yolo11n.pt
      - key: STORAGE_RAW_DIR
        value: data/raw
      - key: STORAGE_PROCESSED_DIR
        value: data/processed
      - key: STORAGE_OUTPUTS_DIR
        value: outputs
      - key: DEMO_DATA_DIR
        value: data/demo
      - key: CORS_ORIGIN_REGEX
        value: "^https:\\/\\/.*\\.vercel\\.app$"
