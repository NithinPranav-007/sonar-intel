services:
  - type: web
    name: sonar-intel-backend
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: ml/models/dristri/best_detector.pt
      - key: INFERENCE_DEVICE
        value: cpu
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: ALLOWED_ORIGINS
        value: "*"
